<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ice: #e8f4f8;
    --ice-deep: #c9dfe8;
    --rink: #0a1628;
    --rink-mid: #12213d;
    --rink-surface: #1a2e4a;
    --accent: #c8102e;
    --accent-gold: #f5a623;
    --text-primary: #f0f4f8;
    --text-secondary: #8fa8c0;
    --text-muted: #506070;
    --border: rgba(200,225,240,0.08);
    --border-strong: rgba(200,225,240,0.15);
    --win: #27ae60;
    --lose: #c8102e;
    --neutral: #f5a623;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--rink);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Rink texture background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,80,160,0.18) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
    pointer-events: none;
    z-index: 0;
  }

  /* ── LOGIN ────────────────────────────────── */
  #login-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rink);
  }

  .login-box {
    width: 360px;
    text-align: center;
    animation: fadeUp 0.6s ease both;
  }

  .login-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    letter-spacing: 4px;
    color: var(--text-primary);
    line-height: 1;
    margin-bottom: 4px;
  }

  .login-logo span { color: var(--accent); }

  .login-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .login-form input {
    background: var(--rink-surface);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    padding: 14px 18px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    letter-spacing: 2px;
  }

  .login-form input:focus { border-color: var(--accent); }
  .login-form input::placeholder { color: var(--text-muted); letter-spacing: 1px; }

  .login-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  .login-btn:hover { opacity: 0.9; }
  .login-btn:active { transform: scale(0.98); }

  .login-error {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    min-height: 20px;
    margin-top: 4px;
  }

  .login-decoration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .login-decoration::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    border: 1px solid rgba(200,16,46,0.08);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .login-decoration::after {
    content: '';
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    border: 1px solid rgba(200,16,46,0.04);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* ── APP SHELL ─────────────────────────────── */
  #app { position: relative; z-index: 1; display: none; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
  }

  .header-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--text-primary);
  }

  .header-logo span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    padding: 6px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--accent); color: var(--accent); }

  .refresh-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--win);
    animation: pulse 2s ease infinite;
  }

  /* ── MAIN CONTENT ───────────────────────────── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .section-header {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 20px;
  }

  /* ── GAME CARD ─────────────────────────────── */
  .game-card {
    background: var(--rink-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }

  .game-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .game-card:hover::before { opacity: 1; }

  .card-time-bar {
    background: var(--rink-surface);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .card-time {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .card-status {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
  }

  .status-scheduled { color: var(--neutral); background: rgba(245,166,35,0.1); }
  .status-live { color: var(--win); background: rgba(39,174,96,0.1); animation: pulse 1.5s ease infinite; }
  .status-final { color: var(--text-muted); background: rgba(80,96,112,0.2); }

  .card-matchup {
    padding: 20px 16px 16px;
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    gap: 8px;
    align-items: center;
  }

  .team-block { }
  .team-block.away { text-align: right; }

  .team-abbr-lg {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
    color: var(--text-primary);
  }

  .team-record {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .team-goalie {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .team-b2b {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--neutral);
    margin-top: 2px;
  }

  .vs-label {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Score bar */
  .score-section {
    padding: 0 16px 16px;
  }

  .score-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .score-num {
    font-family: 'DM Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    line-height: 1;
  }

  .score-home { color: #4db8ff; }
  .score-away { color: #ff7070; text-align: right; }
  .score-slash { color: var(--text-muted); font-size: 12px; text-align: center; }

  .score-bar-wrap {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    gap: 1px;
    margin-bottom: 6px;
  }

  .score-bar-home {
    background: #4db8ff;
    border-radius: 3px 0 0 3px;
    transition: width 0.6s ease;
  }

  .score-bar-away {
    background: #ff7070;
    border-radius: 0 3px 3px 0;
    transition: width 0.6s ease;
    margin-left: auto;
  }

  .score-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
  }

  .card-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-injuries {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }

  .expand-hint {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* ── MODAL ──────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(5,12,25,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--rink-mid);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    width: 100%;
    max-width: 740px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(20px);
    transition: transform 0.25s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: sticky;
    top: 0;
    background: var(--rink-mid);
    z-index: 10;
  }

  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    color: var(--text-primary);
  }

  .modal-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    width: 32px;
    height: 32px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  /* Spread calc boxes */
  .spread-section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .spread-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .spread-boxes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .spread-box {
    background: var(--rink-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .spread-box::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
  }

  .spread-box.home::before { background: #4db8ff; }
  .spread-box.away::before { background: #ff7070; }

  .spread-box-abbr {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    line-height: 1;
  }

  .spread-box.home .spread-box-abbr { color: #4db8ff; }
  .spread-box.away .spread-box-abbr { color: #ff7070; }

  .spread-box-score {
    font-family: 'DM Mono', monospace;
    font-size: 40px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.1;
    margin: 4px 0;
  }

  .spread-box-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .spread-winner-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 2px;
    margin-top: 8px;
    display: inline-block;
  }

  .tag-win { background: rgba(39,174,96,0.12); color: var(--win); }
  .tag-lose { background: rgba(200,16,46,0.08); color: rgba(200,16,46,0.6); }

  /* Factor breakdown table */
  .factors-section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .factors-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
  }

  .factor-group-title {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 14px 0 8px;
    grid-column: 1 / -1;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .factor-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    gap: 8px;
  }

  .factor-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .factor-scores {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .factor-score-val {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    min-width: 34px;
    text-align: right;
  }

  .factor-score-val.home-val { color: #4db8ff; }
  .factor-score-val.away-val { color: #ff7070; }

  .factor-max {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    min-width: 22px;
  }

  /* Summary box */
  .summary-section {
    padding: 20px 24px;
  }

  .summary-box {
    background: var(--rink-surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent-gold);
    border-radius: 0 6px 6px 0;
    padding: 16px 18px;
  }

  .summary-box-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .summary-text {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-secondary);
  }

  .injuries-list {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .injury-tag {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    background: rgba(200,16,46,0.08);
    border: 1px solid rgba(200,16,46,0.15);
    border-radius: 3px;
    color: rgba(255,120,120,0.8);
  }

  /* ── Loading / Empty states ─── */
  .loading {
    text-align: center;
    padding: 80px 0;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  .empty-state {
    text-align: center;
    padding: 80px 0;
    color: var(--text-muted);
  }

  .empty-state-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .empty-state-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
  }

  /* ── Animations ─────────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }

  .card-enter {
    animation: fadeUp 0.4s ease both;
  }

  /* ── Scrollbar ────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--rink); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  @media (max-width: 600px) {
    .games-grid { grid-template-columns: 1fr; }
    .spread-boxes { grid-template-columns: 1fr 1fr; }
    .header { padding: 14px 16px; }
    .main { padding: 20px 12px 60px; }
    .modal { max-height: 95vh; }
    .factors-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ── LOGIN ───────────────────────────── -->
<div id="login-screen">
  <div class="login-decoration"></div>
  <div class="login-box">
    <div class="login-logo">NHL<span>STAT</span></div>
    <div class="login-sub">Spread Analysis Dashboard</div>
    <form class="login-form" onsubmit="handleLogin(event)">
      <input type="password" id="pw-input" placeholder="ENTER PASSWORD" autocomplete="current-password">
      <button class="login-btn" type="submit">ACCESS</button>
    </form>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── APP ─────────────────────────────── -->
<div id="app">
  <header class="header">
    <div class="header-logo">NHL<span>STAT</span></div>
    <div class="header-right">
      <div class="refresh-indicator">
        <div class="pulse-dot"></div>
        <span id="last-updated">LIVE</span>
      </div>
      <div class="header-date" id="header-date"></div>
      <button class="logout-btn" onclick="handleLogout()">LOGOUT</button>
    </div>
  </header>

  <main class="main">
    <div class="section-header" id="games-header">LOADING TONIGHT'S GAMES</div>
    <div id="games-container">
      <div class="loading"><span class="loading-dots">FETCHING GAME DATA</span></div>
    </div>
  </main>
</div>

<!-- ── MODAL ──────────────────────────── -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── Auth ────────────────────────────────────────────────────────────
async function handleLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadGames();
      startAutoRefresh();
    } else {
      err.textContent = 'INVALID PASSWORD';
      document.getElementById('pw-input').value = '';
    }
  } catch {
    err.textContent = 'CONNECTION ERROR';
  }
}

async function handleLogout() {
  await fetch('/auth/logout', { method: 'POST' });
  location.reload();
}

async function checkAuth() {
  const res = await fetch('/auth/check');
  const data = await res.json();
  if (data.authenticated) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadGames();
    startAutoRefresh();
  }
}

// ── Data ─────────────────────────────────────────────────────────────
let gamesData = [];

async function loadGames() {
  try {
    const res = await fetch('/api/games');
    if (res.status === 401) { location.reload(); return; }
    const data = await res.json();
    gamesData = data.games;
    renderGames(data);
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'UPDATED ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('header-date').textContent = data.date;
  } catch(e) {
    console.error(e);
  }
}

// Auto-refresh every 5 minutes
function startAutoRefresh() {
  setInterval(loadGames, 5 * 60 * 1000);
}

// ── Render ────────────────────────────────────────────────────────────
function renderGames(data) {
  const header = document.getElementById('games-header');
  const container = document.getElementById('games-container');

  if (!data.games || data.games.length === 0) {
    header.textContent = 'NO GAMES TONIGHT';
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🏒</div>
        <div class="empty-state-text">NO NHL GAMES SCHEDULED</div>
      </div>`;
    return;
  }

  header.textContent = `TONIGHT — ${data.games.length} GAME${data.games.length !== 1 ? 'S' : ''}`;
  container.innerHTML = `<div class="games-grid">${data.games.map((g, i) => gameCard(g, i)).join('')}</div>`;
}

function barWidths(homeScore, awayScore) {
  const total = homeScore + awayScore;
  const hw = Math.round((homeScore / total) * 100);
  const aw = 100 - hw;
  return { hw, aw };
}

function statusClass(status) {
  if (status === 'live') return 'status-live';
  if (status === 'final') return 'status-final';
  return 'status-scheduled';
}

function gameCard(g, i) {
  const { hw, aw } = barWidths(g.home.score, g.away.score);
  const homeWins = g.home.score > g.away.score;
  const injuryText = [...(g.home.injuries || []), ...(g.away.injuries || [])].slice(0, 3).join(' · ') || 'No injuries reported';

  return `
  <div class="game-card card-enter" style="animation-delay:${i * 0.08}s" onclick="openModal('${g.id}')">
    <div class="card-time-bar">
      <span class="card-time">${g.time}</span>
      <span class="card-status ${statusClass(g.status)}">${g.status.toUpperCase()}</span>
    </div>
    <div class="card-matchup">
      <div class="team-block home">
        <div class="team-abbr-lg">${g.home.abbr}</div>
        <div class="team-record">${g.home.record}</div>
        <div class="team-goalie">${g.home.starterName}</div>
        ${g.home.isBackToBack ? '<div class="team-b2b">B2B</div>' : ''}
      </div>
      <div class="vs-label">VS</div>
      <div class="team-block away">
        <div class="team-abbr-lg">${g.away.abbr}</div>
        <div class="team-record">${g.away.record}</div>
        <div class="team-goalie">${g.away.starterName}</div>
        ${g.away.isBackToBack ? '<div class="team-b2b">B2B</div>' : ''}
      </div>
    </div>
    <div class="score-section">
      <div class="score-row">
        <div class="score-num score-home">${g.home.score}</div>
        <div class="score-slash">/ 100</div>
        <div class="score-num score-away">${g.away.score}</div>
      </div>
      <div class="score-bar-wrap">
        <div class="score-bar-home" style="width:${hw}%"></div>
        <div class="score-bar-away" style="width:${aw}%"></div>
      </div>
      <div class="score-labels">
        <span>${g.home.abbr} SPREAD</span>
        <span>${g.away.abbr} SPREAD</span>
      </div>
    </div>
    <div class="card-footer">
      <div class="card-injuries">⚠ ${injuryText}</div>
      <div class="expand-hint">ANALYSIS ↗</div>
    </div>
  </div>`;
}

// ── Modal ──────────────────────────────────────────────────────────────
function openModal(gameId) {
  const g = gamesData.find(x => x.id === gameId);
  if (!g) return;

  const homeWins = g.home.score > g.away.score;
  const allInjuries = [...(g.home.injuries || []).map(x => `${g.home.abbr}: ${x}`),
                       ...(g.away.injuries || []).map(x => `${g.away.abbr}: ${x}`)];

  const factorGroups = [
    { label: 'Goaltending', keys: ['startingGoalie', 'goalieRecentForm'] },
    { label: 'Team Strength', keys: ['xGDifferential', 'offensiveStrength', 'defensiveStrength', 'injuries', 'topLineMatchups', 'depthScoring'] },
    { label: 'Special Teams', keys: ['powerPlay', 'penaltyKill', 'faceoffPct'] },
    { label: 'Situational', keys: ['homeAway', 'restFatigue', 'puckLuck', 'travel', 'momentum', 'gameImportance'] },
    { label: 'Coaching', keys: ['coachingSystem', 'lineMatching', 'inGameAdjustments'] },
  ];

  const factorLabels = {
    startingGoalie: 'Starting goalie', goalieRecentForm: 'Goalie recent form',
    xGDifferential: 'xG / shot quality differential', offensiveStrength: 'Offensive strength',
    defensiveStrength: 'Defensive strength', injuries: 'Injuries to key players',
    topLineMatchups: 'Top-line matchups', depthScoring: 'Depth scoring',
    powerPlay: 'Power play efficiency', penaltyKill: 'Penalty kill efficiency',
    faceoffPct: 'Faceoff win %', homeAway: 'Home vs away', restFatigue: 'Rest vs fatigue',
    puckLuck: 'Puck luck / variance', travel: 'Travel distance', momentum: 'Momentum / recent form',
    gameImportance: 'Game importance / motivation', coachingSystem: 'Coaching strategy / system',
    lineMatching: 'Line matching advantage', inGameAdjustments: 'In-game adjustments',
  };

  const factorRows = factorGroups.map(group => `
    <div class="factor-group-title">${group.label}</div>
    ${group.keys.map(key => {
      const hw = g.home.factors[key];
      const aw = g.away.factors[key];
      const maxW = g.weights[key];
      if (hw === undefined) return '';
      return `
      <div class="factor-item">
        <span class="factor-name">${factorLabels[key] || key}</span>
        <div class="factor-scores">
          <span class="factor-score-val home-val">${hw.toFixed(1)}</span>
          <span class="factor-score-val away-val">${aw.toFixed(1)}</span>
          <span class="factor-max">/${maxW}</span>
        </div>
      </div>`;
    }).join('')}
  `).join('');

  const factorHeader = `
    <div class="factor-item" style="padding-bottom:8px;margin-bottom:4px;">
      <span class="factor-name" style="color:var(--text-muted);font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;">FACTOR</span>
      <div class="factor-scores">
        <span class="factor-score-val home-val" style="font-size:10px;letter-spacing:1px;">${g.home.abbr}</span>
        <span class="factor-score-val away-val" style="font-size:10px;letter-spacing:1px;">${g.away.abbr}</span>
        <span class="factor-max">MAX</span>
      </div>
    </div>`;

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-title">${g.home.abbr} vs ${g.away.abbr} — Spread Calculation</div>
        <div class="modal-subtitle">${g.time} · EACH TEAM SCORED 0–100 VS LEAGUE BENCHMARKS</div>
      </div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>

    <div class="spread-section">
      <div class="spread-label">Spread Score</div>
      <div class="spread-boxes">
        <div class="spread-box home">
          <div class="spread-box-abbr">${g.home.abbr}</div>
          <div class="spread-box-score">${g.home.score}</div>
          <div class="spread-box-label">HOME · OUT OF 100</div>
          <div class="spread-winner-tag ${homeWins ? 'tag-win' : 'tag-lose'}">${homeWins ? '▲ MODEL EDGE' : '▼ DISADVANTAGED'}</div>
        </div>
        <div class="spread-box away">
          <div class="spread-box-abbr">${g.away.abbr}</div>
          <div class="spread-box-score">${g.away.score}</div>
          <div class="spread-box-label">AWAY · OUT OF 100</div>
          <div class="spread-winner-tag ${!homeWins ? 'tag-win' : 'tag-lose'}">${!homeWins ? '▲ MODEL EDGE' : '▼ DISADVANTAGED'}</div>
        </div>
      </div>
    </div>

    <div class="factors-section">
      <div class="spread-label">Factor Breakdown — ${g.home.abbr} vs ${g.away.abbr}</div>
      ${factorHeader}
      ${factorRows}
    </div>

    <div class="summary-section">
      <div class="summary-box">
        <div class="summary-box-label">Game Summary</div>
        <div class="summary-text">${g.summary}</div>
        ${allInjuries.length ? `
        <div class="injuries-list">
          ${allInjuries.map(inj => `<span class="injury-tag">⚠ ${inj}</span>`).join('')}
        </div>` : ''}
      </div>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModalBtn() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalBtn();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalBtn();
});

// ── Init ─────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
