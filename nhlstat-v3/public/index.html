<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --rink:       #0a1628;
  --rink-mid:   #12213d;
  --rink-surf:  #1a2e4a;
  --accent:     #c8102e;
  --gold:       #f5a623;
  --tp:         #f0f4f8;
  --ts:         #8fa8c0;
  --tm:         #506070;
  --border:     rgba(200,225,240,0.08);
  --bstrong:    rgba(200,225,240,0.15);
  --win:        #27ae60;
  --blue:       #4db8ff;
  --red:        #ff7070;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--rink);color:var(--tp);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(0,80,160,0.18) 0%,transparent 70%),repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,0.015) 39px,rgba(255,255,255,0.015) 40px);pointer-events:none;z-index:0;}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--rink);}
.login-deco{position:fixed;inset:0;pointer-events:none;}
.login-deco::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;border:1px solid rgba(200,16,46,0.08);top:50%;left:50%;transform:translate(-50%,-50%);}
.login-deco::after{content:'';position:absolute;width:900px;height:900px;border-radius:50%;border:1px solid rgba(200,16,46,0.04);top:50%;left:50%;transform:translate(-50%,-50%);}
.login-box{width:360px;text-align:center;animation:fadeUp .6s ease both;position:relative;z-index:1;}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:4px;line-height:1;margin-bottom:4px;}
.login-logo span{color:var(--accent);}
.login-sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--tm);text-transform:uppercase;margin-bottom:40px;}
.login-form{display:flex;flex-direction:column;gap:12px;}
.login-form input{background:var(--rink-surf);border:1px solid var(--bstrong);color:var(--tp);padding:14px 18px;font-family:'DM Mono',monospace;font-size:14px;border-radius:4px;outline:none;transition:border-color .2s;text-align:center;letter-spacing:2px;}
.login-form input:focus{border-color:var(--accent);}
.login-form input::placeholder{color:var(--tm);letter-spacing:1px;}
.login-btn{background:var(--accent);color:white;border:none;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;border-radius:4px;cursor:pointer;transition:opacity .2s,transform .1s;}
.login-btn:hover{opacity:.9;}
.login-btn:active{transform:scale(.98);}
.login-err{font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);min-height:20px;margin-top:4px;}

/* ── APP ── */
#app{position:relative;z-index:1;display:none;}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;background:rgba(10,22,40,0.94);backdrop-filter:blur(14px);}
.header-left{display:flex;align-items:center;gap:16px;}
.header-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;}
.header-logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:14px;}
.header-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--tm);letter-spacing:1px;}

/* Refresh button */
.refresh-btn{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--bstrong);color:var(--ts);padding:7px 14px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;border-radius:4px;cursor:pointer;transition:all .2s;}
.refresh-btn:hover{border-color:var(--win);color:var(--win);}
.refresh-btn:active{transform:scale(.97);}
.refresh-btn.spinning .refresh-icon{animation:spin .7s linear infinite;}
.refresh-icon{display:inline-block;font-size:13px;line-height:1;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Live indicator */
.live-pill{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:var(--tm);}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--win);animation:pulse 2s ease infinite;}

/* Logout */
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--tm);padding:6px 12px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;border-radius:3px;cursor:pointer;transition:all .2s;}
.logout-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MAIN ── */
.main{max-width:1240px;margin:0 auto;padding:28px 22px 80px;}
.section-hdr{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--tm);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px;}

/* ── GAME CARD ── */
.game-card{background:var(--rink-mid);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s;position:relative;}
.game-card:hover{border-color:var(--bstrong);transform:translateY(-2px);}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:0;transition:opacity .2s;}
.game-card:hover::before{opacity:1;}

.card-topbar{background:var(--rink-surf);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.card-time{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm);}
.card-status{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:2px;}
.s-scheduled{color:var(--gold);background:rgba(245,166,35,.1);}
.s-live{color:var(--win);background:rgba(39,174,96,.1);animation:pulse 1.5s ease infinite;}
.s-final{color:var(--tm);background:rgba(80,96,112,.2);}

.card-matchup{padding:16px 14px 10px;display:grid;grid-template-columns:1fr 36px 1fr;gap:6px;align-items:center;}
.team-block{}
.team-block.away{text-align:right;}
.team-logo{width:42px;height:42px;object-fit:contain;display:block;margin-bottom:5px;filter:drop-shadow(0 0 6px rgba(255,255,255,0.07));}
.team-block.away .team-logo{margin-left:auto;}
.team-abbr-lg{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;line-height:1;}
.team-record{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm);margin-top:2px;}
.team-goalie{font-family:'DM Mono',monospace;font-size:9px;color:var(--ts);margin-top:3px;}
.team-b2b{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);margin-top:2px;}
.vs-lbl{text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--tm);}

/* Score section */
.score-section{padding:0 14px 14px;}

/* Moneyline projection row */
.ml-proj-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:5px;border:1px solid var(--border);}
.ml-proj-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tm);}
.ml-proj-odds{display:flex;gap:14px;align-items:center;}
.ml-proj-home{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--blue);}
.ml-proj-away{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;color:var(--red);}
.ml-proj-home.fav,.ml-proj-away.fav{font-size:18px;}

.score-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:6px;}
.score-num{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;line-height:1;}
.score-home{color:var(--blue);}
.score-away{color:var(--red);text-align:right;}
.score-slash{color:var(--tm);font-size:11px;text-align:center;}

.score-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:1px;margin-bottom:5px;}
.bar-home{background:var(--blue);border-radius:3px 0 0 3px;transition:width .6s ease;}
.bar-away{background:var(--red);border-radius:0 3px 3px 0;transition:width .6s ease;}
.score-labels{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);}

.card-footer{padding:9px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-injuries{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.expand-hint{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);letter-spacing:1px;flex-shrink:0;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(5,12,25,.87);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--rink-mid);border:1px solid var(--bstrong);border-radius:10px;width:100%;max-width:740px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s;}
.modal-overlay.open .modal{transform:translateY(0);}

.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--rink-mid);z-index:10;}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;}
.modal-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);letter-spacing:1px;margin-top:3px;}
.modal-close{background:transparent;border:1px solid var(--bstrong);color:var(--ts);width:30px;height:30px;border-radius:4px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.modal-close:hover{border-color:var(--accent);color:var(--accent);}

/* ML calc section */
.ml-section{padding:18px 22px;border-bottom:1px solid var(--border);}
.section-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tm);margin-bottom:12px;}

/* Big ML table */
.ml-table{background:var(--rink-surf);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
.ml-table-row{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr 1px 1fr;gap:0;align-items:stretch;}
.ml-table-divider{background:var(--border);margin:0 4px;}
.ml-table-cell{padding:6px 12px;text-align:center;}
.ml-cell-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--tm);margin-bottom:5px;}
.ml-cell-team{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px;}
.ml-cell-team img{width:32px;height:32px;object-fit:contain;}
.ml-cell-team-abbr{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;}
.ml-cell-val{font-family:'DM Mono',monospace;font-size:22px;font-weight:500;}
.ml-cell-val.blue{color:var(--blue);}
.ml-cell-val.red{color:var(--red);}
.ml-cell-val.implied{font-size:16px;color:var(--ts);}

/* Score boxes */
.score-boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
.score-box{background:var(--rink-surf);border:1px solid var(--border);border-radius:6px;padding:14px 16px;text-align:center;position:relative;overflow:hidden;}
.score-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;}
.score-box.home::after{background:var(--blue);}
.score-box.away::after{background:var(--red);}
.sb-team{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
.sb-team img{width:38px;height:38px;object-fit:contain;}
.sb-abbr{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;}
.score-box.home .sb-abbr{color:var(--blue);}
.score-box.away .sb-abbr{color:var(--red);}
.sb-score{font-family:'DM Mono',monospace;font-size:38px;font-weight:500;color:var(--tp);line-height:1.1;margin:2px 0;}
.sb-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);}
.sb-tag{font-family:'DM Mono',monospace;font-size:9px;padding:3px 10px;border-radius:2px;margin-top:7px;display:inline-block;}
.tag-win{background:rgba(39,174,96,.12);color:var(--win);}
.tag-lose{background:rgba(200,16,46,.08);color:rgba(200,16,46,.6);}

/* Factor table */
.factors-section{padding:18px 22px;border-bottom:1px solid var(--border);}
.factor-hdr{display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.factor-hdr span{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);letter-spacing:1px;}
.factor-hdr .fh-scores{display:flex;gap:10px;}
.factor-group-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tm);margin:12px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--border);}
.factor-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.factor-name{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--ts);}
.factor-vals{display:flex;gap:10px;flex-shrink:0;}
.fv{font-family:'DM Mono',monospace;font-size:11px;min-width:34px;text-align:right;}
.fv.hv{color:var(--blue);}
.fv.av{color:var(--red);}
.fv.mx{color:var(--tm);font-size:9px;}

/* Summary */
.summary-section{padding:18px 22px;}
.summary-box{background:var(--rink-surf);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:14px 16px;}
.summary-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tm);margin-bottom:8px;}
.summary-text{font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.7;color:var(--ts);}
.injury-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.inj-tag{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;background:rgba(200,16,46,.08);border:1px solid rgba(200,16,46,.15);border-radius:3px;color:rgba(255,120,120,.8);}

/* States */
.loading{text-align:center;padding:80px 0;font-family:'DM Mono',monospace;font-size:12px;color:var(--tm);letter-spacing:2px;}
.empty{text-align:center;padding:80px 0;}
.empty-icon{font-size:48px;opacity:.3;margin-bottom:14px;}
.empty-text{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--tm);}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:300;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;padding:10px 18px;border-radius:5px;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.3);color:var(--win);}
.toast.error{background:rgba(200,16,46,.12);border:1px solid rgba(200,16,46,.25);color:#ff7070;}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.card-enter{animation:fadeUp .4s ease both;}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--rink);}
::-webkit-scrollbar-thumb{background:var(--bstrong);border-radius:3px;}

@media(max-width:600px){
  .games-grid{grid-template-columns:1fr;}
  .header{padding:12px 14px;}
  .header-date{display:none;}
  .main{padding:18px 10px 60px;}
  .ml-table-row{grid-template-columns:1fr 1px 1fr;}
  .ml-table-row .ml-table-cell:nth-child(n+4){display:none;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-deco"></div>
  <div class="login-box">
    <div class="login-logo">NHL<span>STAT</span></div>
    <div class="login-sub">Moneyline Analysis Dashboard</div>
    <form class="login-form" onsubmit="doLogin(event)">
      <input type="password" id="pw" placeholder="ENTER PASSWORD" autocomplete="current-password">
      <button class="login-btn" type="submit">ACCESS</button>
    </form>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="header">
    <div class="header-left">
      <div class="header-logo">NHL<span>STAT</span></div>
      <button class="refresh-btn" id="refresh-btn" onclick="doRefresh()">
        <span class="refresh-icon">↻</span>
        <span>REFRESH</span>
      </button>
    </div>
    <div class="header-right">
      <div class="live-pill">
        <div class="pulse-dot"></div>
        <span id="last-updated">LIVE</span>
      </div>
      <div class="header-date" id="header-date"></div>
      <button class="logout-btn" onclick="doLogout()">LOGOUT</button>
    </div>
  </header>

  <main class="main">
    <div class="section-hdr" id="games-hdr">LOADING TONIGHT'S GAMES</div>
    <div id="games-container">
      <div class="loading">FETCHING GAME DATA...</div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-body"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  try {
    const r = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
    if (r.ok) { showApp(); loadGames(); startAutoRefresh(); }
    else { err.textContent = 'INVALID PASSWORD'; document.getElementById('pw').value = ''; }
  } catch { err.textContent = 'CONNECTION ERROR'; }
}

async function doLogout() {
  await fetch('/auth/logout', { method:'POST' });
  location.reload();
}

async function checkAuth() {
  const r = await fetch('/auth/check');
  const d = await r.json();
  if (d.authenticated) { showApp(); loadGames(); startAutoRefresh(); }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ── Data ──────────────────────────────────────────────────────────────────────
let gamesData = [];

async function loadGames(forceRefresh = false) {
  try {
    const url = forceRefresh ? '/api/refresh' : '/api/games';
    const method = forceRefresh ? 'POST' : 'GET';
    const r = await fetch(url, { method });
    if (r.status === 401) { location.reload(); return; }
    const data = await r.json();
    gamesData = data.games;
    renderGames(data);
    const t = new Date();
    document.getElementById('last-updated').textContent =
      'UPDATED ' + t.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('header-date').textContent = data.date || '';
    if (forceRefresh) showToast('Games refreshed from NHL API', 'success');
  } catch(e) {
    console.error(e);
    if (forceRefresh) showToast('Refresh failed — using cached data', 'error');
  }
}

async function doRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.disabled = true;
  await loadGames(true);
  btn.classList.remove('spinning');
  btn.disabled = false;
}

function startAutoRefresh() {
  setInterval(() => loadGames(false), 5 * 60 * 1000);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderGames(data) {
  const hdr = document.getElementById('games-hdr');
  const con = document.getElementById('games-container');
  if (!data.games || !data.games.length) {
    hdr.textContent = 'NO GAMES TODAY';
    con.innerHTML = `<div class="empty"><div class="empty-icon">🏒</div><div class="empty-text">NO NHL GAMES SCHEDULED TODAY</div></div>`;
    return;
  }
  hdr.textContent = `TONIGHT — ${data.games.length} GAME${data.games.length !== 1 ? 'S' : ''}`;
  con.innerHTML = `<div class="games-grid">${data.games.map((g, i) => cardHTML(g, i)).join('')}</div>`;
}

function logo(url, abbr) {
  if (!url) return '';
  return `<img class="team-logo" src="${url}" alt="${abbr}" onerror="this.style.display='none'">`;
}

function statusCls(s) {
  return s === 'live' ? 's-live' : s === 'final' ? 's-final' : 's-scheduled';
}

function cardHTML(g, i) {
  const total = g.home.score + g.away.score;
  const hw = Math.round((g.home.score / total) * 100);
  const aw = 100 - hw;
  const ml = g.moneyline || {};
  const homeFav = g.home.score >= g.away.score;
  const injText = [...(g.home.injuries||[]), ...(g.away.injuries||[])].slice(0,3).join(' · ') || 'No injuries reported';

  return `
<div class="game-card card-enter" style="animation-delay:${i*.08}s" onclick="openModal('${g.id}')">
  <div class="card-topbar">
    <span class="card-time">${g.time}${g.venue ? ' · '+g.venue : ''}</span>
    <span class="card-status ${statusCls(g.status)}">${g.status.toUpperCase()}</span>
  </div>
  <div class="card-matchup">
    <div class="team-block home">
      ${logo(g.home.logoUrl, g.home.abbr)}
      <div class="team-abbr-lg">${g.home.abbr}</div>
      <div class="team-record">${g.home.record}</div>
      <div class="team-goalie">${g.home.starterName}</div>
      ${g.home.isBackToBack ? '<div class="team-b2b">B2B</div>' : ''}
    </div>
    <div class="vs-lbl">VS</div>
    <div class="team-block away">
      ${logo(g.away.logoUrl, g.away.abbr)}
      <div class="team-abbr-lg">${g.away.abbr}</div>
      <div class="team-record">${g.away.record}</div>
      <div class="team-goalie">${g.away.starterName}</div>
      ${g.away.isBackToBack ? '<div class="team-b2b">B2B</div>' : ''}
    </div>
  </div>
  <div class="score-section">
    <div class="ml-proj-row">
      <span class="ml-proj-label">Moneyline Projection</span>
      <div class="ml-proj-odds">
        <span class="ml-proj-home ${homeFav?'fav':''}">${ml.homeML||'—'}</span>
        <span class="ml-proj-away ${!homeFav?'fav':''}">${ml.awayML||'—'}</span>
      </div>
    </div>
    <div class="score-row">
      <div class="score-num score-home">${g.home.score}</div>
      <div class="score-slash">/ 100</div>
      <div class="score-num score-away">${g.away.score}</div>
    </div>
    <div class="score-bar">
      <div class="bar-home" style="width:${hw}%"></div>
      <div class="bar-away" style="width:${aw}%"></div>
    </div>
    <div class="score-labels">
      <span>${g.home.abbr} SCORE</span>
      <span>${g.away.abbr} SCORE</span>
    </div>
  </div>
  <div class="card-footer">
    <div class="card-injuries">⚠ ${injText}</div>
    <div class="expand-hint">ANALYSIS ↗</div>
  </div>
</div>`;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(id) {
  const g = gamesData.find(x => x.id === id);
  if (!g) return;
  const hw = g.home.score > g.away.score;
  const ml = g.moneyline || {};
  const allInj = [
    ...(g.home.injuries||[]).map(x=>`${g.home.abbr}: ${x}`),
    ...(g.away.injuries||[]).map(x=>`${g.away.abbr}: ${x}`),
  ];

  const GROUPS = [
    { label:'Goaltending',   keys:['startingGoalie','goalieRecentForm'] },
    { label:'Team Strength', keys:['xGDifferential','offensiveStrength','defensiveStrength','injuries','topLineMatchups','depthScoring'] },
    { label:'Special Teams', keys:['powerPlay','penaltyKill','faceoffPct'] },
    { label:'Situational',   keys:['homeAway','restFatigue','puckLuck','travel','momentum','gameImportance'] },
    { label:'Coaching',      keys:['coachingSystem','lineMatching','inGameAdjustments'] },
  ];

  const LABELS = {
    startingGoalie:'Starting goalie', goalieRecentForm:'Goalie recent form',
    xGDifferential:'xG / shot quality diff', offensiveStrength:'Offensive strength',
    defensiveStrength:'Defensive strength', injuries:'Injuries to key players',
    topLineMatchups:'Top-line matchups', depthScoring:'Depth scoring',
    powerPlay:'Power play efficiency', penaltyKill:'Penalty kill efficiency',
    faceoffPct:'Faceoff win %', homeAway:'Home vs away', restFatigue:'Rest vs fatigue',
    puckLuck:'Puck luck / variance', travel:'Travel distance',
    momentum:'Momentum / recent form', gameImportance:'Game importance',
    coachingSystem:'Coaching strategy', lineMatching:'Line matching (home adv)',
    inGameAdjustments:'In-game adjustments',
  };

  const factorRows = GROUPS.map(gr => `
    <div class="factor-group-title">${gr.label}</div>
    ${gr.keys.map(k => {
      const hv = g.home.factors[k], av = g.away.factors[k], mx = g.weights[k];
      if (hv === undefined) return '';
      return `<div class="factor-item">
        <span class="factor-name">${LABELS[k]||k}</span>
        <div class="factor-vals">
          <span class="fv hv">${hv.toFixed(1)}</span>
          <span class="fv av">${av.toFixed(1)}</span>
          <span class="fv mx">/${mx}</span>
        </div>
      </div>`;
    }).join('')}
  `).join('');

  const logoTag = (url, abbr) => url
    ? `<img src="${url}" style="width:32px;height:32px;object-fit:contain;" onerror="this.style.display='none'">`
    : '';

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-hdr">
      <div>
        <div class="modal-title">${g.home.abbr} vs ${g.away.abbr} — Moneyline Calculator</div>
        <div class="modal-sub">${g.time} · EACH TEAM SCORED 0–100 VS LEAGUE BENCHMARKS</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="ml-section">
      <div class="section-label">Moneyline Projection</div>

      <div class="ml-table">
        <div class="ml-table-row">
          <div class="ml-table-cell">
            <div class="ml-cell-team">
              ${logoTag(g.home.logoUrl, g.home.abbr)}
              <span class="ml-cell-team-abbr" style="color:var(--blue)">${g.home.abbr}</span>
            </div>
            <div class="ml-cell-lbl">MONEYLINE</div>
            <div class="ml-cell-val blue">${ml.homeML||'—'}</div>
          </div>
          <div class="ml-table-divider"></div>
          <div class="ml-table-cell">
            <div class="ml-cell-lbl" style="margin-top:4px">IMPLIED WIN %</div>
            <div class="ml-cell-val implied">${ml.homeImplied||'—'}%</div>
          </div>
          <div class="ml-table-divider"></div>
          <div class="ml-table-cell">
            <div class="ml-cell-lbl" style="margin-top:4px">IMPLIED WIN %</div>
            <div class="ml-cell-val implied">${ml.awayImplied||'—'}%</div>
          </div>
          <div class="ml-table-divider"></div>
          <div class="ml-table-cell">
            <div class="ml-cell-team">
              ${logoTag(g.away.logoUrl, g.away.abbr)}
              <span class="ml-cell-team-abbr" style="color:var(--red)">${g.away.abbr}</span>
            </div>
            <div class="ml-cell-lbl">MONEYLINE</div>
            <div class="ml-cell-val red">${ml.awayML||'—'}</div>
          </div>
        </div>
      </div>

      <div class="score-boxes">
        <div class="score-box home">
          <div class="sb-team">
            ${logoTag(g.home.logoUrl, g.home.abbr)}
            <span class="sb-abbr">${g.home.abbr}</span>
          </div>
          <div class="sb-score">${g.home.score}</div>
          <div class="sb-lbl">HOME · OUT OF 100</div>
          <div class="sb-tag ${hw?'tag-win':'tag-lose'}">${hw?'▲ MODEL EDGE':'▼ DISADVANTAGED'}</div>
        </div>
        <div class="score-box away">
          <div class="sb-team">
            ${logoTag(g.away.logoUrl, g.away.abbr)}
            <span class="sb-abbr">${g.away.abbr}</span>
          </div>
          <div class="sb-score">${g.away.score}</div>
          <div class="sb-lbl">AWAY · OUT OF 100</div>
          <div class="sb-tag ${!hw?'tag-win':'tag-lose'}">${!hw?'▲ MODEL EDGE':'▼ DISADVANTAGED'}</div>
        </div>
      </div>
    </div>

    <div class="factors-section">
      <div class="section-label">Factor Breakdown</div>
      <div class="factor-hdr">
        <span>FACTOR</span>
        <div class="fh-scores">
          <span style="color:var(--blue);min-width:34px;text-align:right;">${g.home.abbr}</span>
          <span style="color:var(--red);min-width:34px;text-align:right;">${g.away.abbr}</span>
          <span style="min-width:22px;text-align:right;">MAX</span>
        </div>
      </div>
      ${factorRows}
    </div>

    <div class="summary-section">
      <div class="summary-box">
        <div class="summary-lbl">Game Summary</div>
        <div class="summary-text">${g.summary}</div>
        ${allInj.length ? `<div class="injury-list">${allInj.map(x=>`<span class="inj-tag">⚠ ${x}</span>`).join('')}</div>` : ''}
      </div>
    </div>`;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.className = `toast ${type} show`;
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
